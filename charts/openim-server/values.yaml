# Default values for openim-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/openimsdk/openim-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations:
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

global:
  sharedValues:
    # Passed to every OpenIM component that needs gateway topology.
    msggatewayReplicaCount: 1
  monitor:
    enabled: false
    additionalLabels: {}
    namespace: ""
    jobLabel: ""
    interval: ""
    scrapeTimeout: ""
    proxyUrl: ""
    selectorOverride: {}
    honorLabels: false
    metricRelabelings: []
    relabelings: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80


nodeSelector: {}

tolerations: []

affinity: {}

notification:

# Discovery is mounted into clients so Kubernetes service ports and the
# addresses registered in etcd remain identical. The upstream chart assumed
# every RPC Service listened on 80, which is not true for the fork's
# message/conversation services.
discovery:
  enable: kubernetes
  etcd:
    rootDirectory: openim
    address:
      - localhost:12379
  kubernetes:
    namespace: openim
  rpcService:
    user: openimserver-openim-rpc-user:80
    friend: openimserver-openim-rpc-friend:80
    msg: openimserver-openim-rpc-msg:10280
    push: openimserver-openim-push:80
    messageGateway: openimserver-openim-msggateway:88
    group: openimserver-openim-rpc-group:80
    auth: openimserver-openim-rpc-auth:80
    conversation: openimserver-openim-rpc-conversation:10220
    third: openimserver-openim-rpc-third:80

config:
