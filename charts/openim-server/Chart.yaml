apiVersion: v2
name: openim-api
description: OpenIM is an open source instant messaging server based on the open source framework of the open source instant messaging SDK.

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.17

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "3.6.0"

home: https://github.com/openimsdk/helm-charts

icon: https://raw.githubusercontent.com/openimsdk/open-im-server/main/assets/openim-logo-gradient.svg

maintainers:
  - name: "OpenIM"
    url: "https://github.com/openimsdk"

keywords:
  - openim
  - im
  - chat
  - openim-server

sources:
  - "https://github.com/openimsdk/open-im-server"
  - "https://github.com/openimsdk/helm-charts"

# Keep the server components versioned as explicit local chart dependencies.
# Without this metadata Helm renders them opportunistically but fails lint and
# cannot produce a reproducible dependency lock.
dependencies:
  - name: openim-msggateway
    version: 0.1.0
    repository: "file://charts/openim-msggateway"
  - name: openim-msggateway-proxy
    version: 0.1.0
    repository: "file://charts/openim-msggateway-proxy"
  - name: openim-msgtransfer
    version: 0.1.0
    repository: "file://charts/openim-msgtransfer"
  - name: openim-push
    version: 0.1.0
    repository: "file://charts/openim-push"
  - name: openim-rpc-auth
    version: 0.1.0
    repository: "file://charts/openim-rpc-auth"
  - name: openim-rpc-conversation
    version: 0.1.0
    repository: "file://charts/openim-rpc-conversation"
  - name: openim-rpc-friend
    version: 0.1.0
    repository: "file://charts/openim-rpc-friend"
  - name: openim-rpc-group
    version: 0.1.0
    repository: "file://charts/openim-rpc-group"
  - name: openim-rpc-msg
    version: 0.1.0
    repository: "file://charts/openim-rpc-msg"
  - name: openim-rpc-third
    version: 0.1.0
    repository: "file://charts/openim-rpc-third"
  - name: openim-rpc-user
    version: 0.1.0
    repository: "file://charts/openim-rpc-user"
