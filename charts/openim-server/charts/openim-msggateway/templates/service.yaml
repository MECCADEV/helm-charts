apiVersion: v1
kind: Service
metadata:
  name: {{ include "openim-msggateway.fullname" . }}
  labels:
    {{- include "openim-msggateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 88
      targetPort: rpc
      protocol: TCP
      # The OpenIM Kubernetes discovery client selects the endpoint port named
      # "grpc" when it fans messages out from push/msgtransfer.
      name: grpc
    - port: 10001
      targetPort: http
      protocol: TCP
      name: http
    - port: 90
      targetPort: 90
      protocol: TCP
      name: metrics-port
  selector:
    {{- include "openim-msggateway.selectorLabels" . | nindent 4 }}
